  <div id="pub-sheet" class="pub-sheet" role="dialog" aria-modal="true" aria-labelledby="pub-sheet-title" aria-hidden="true">
    <div class="pub-sheet-backdrop" data-close-pub></div>
    <div class="pub-sheet-panel">
      <button type="button" class="pub-sheet-close" data-close-pub aria-label="Close">×</button>
      <div class="pub-sheet-content">
        <p class="pub-sheet-venue" id="pub-sheet-venue"></p>
        <h3 class="pub-sheet-title" id="pub-sheet-title"></h3>
        <p class="pub-sheet-authors" id="pub-sheet-authors"></p>
        <div class="pub-sheet-abstract" id="pub-sheet-abstract"></div>
        <a href="#" id="pub-sheet-link" class="pub-sheet-link" target="_blank" rel="noopener">Read paper on ACM →</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var PAPERS = {
        "sign-lang": {
          venue: "ACM Digital Library",
          title: "Deep Learning Methods for Sign Language Translation",
          authors: "Akhil Santha et al.",
          abstract: "Overview of deep learning architectures and models used for sign language translation and recognition. The work explores neural approaches to bridge signed and written languages, with applications in accessibility and human–computer interaction.",
          url: "https://dl.acm.org/doi/10.1145/3477498"
        },
        "deepfakes": {
          venue: "Thesis",
          title: "Deepfakes Generation using GANs",
          authors: "Akhil Santha",
          abstract: "Thesis research on deep neural networks for generating manipulated faces in images and videos. Focus on GAN-based synthesis and detection of deepfakes.",
          url: "#"
        }
      };
      var sheet = document.getElementById("pub-sheet");
      var linkEl = document.getElementById("pub-sheet-link");
      if (!sheet || !linkEl) return;
      function openPub(id) {
        var p = PAPERS[id];
        if (!p) return;
        document.getElementById("pub-sheet-venue").textContent = p.venue;
        document.getElementById("pub-sheet-title").textContent = p.title;
        document.getElementById("pub-sheet-authors").textContent = p.authors;
        document.getElementById("pub-sheet-abstract").textContent = p.abstract;
        linkEl.href = p.url;
        linkEl.textContent = p.url === "#" ? "View details" : "Read paper on ACM →";
        linkEl.style.display = p.url === "#" ? "none" : "";
        sheet.classList.add("pub-sheet-open");
        sheet.setAttribute("aria-hidden", "false");
      }
      function closePub() {
        sheet.classList.remove("pub-sheet-open");
        sheet.setAttribute("aria-hidden", "true");
      }
      document.querySelectorAll(".pub-card").forEach(function (btn) {
        btn.addEventListener("click", function () { openPub(this.getAttribute("data-pub")); });
      });
      document.querySelectorAll("[data-close-pub]").forEach(function (el) {
        el.addEventListener("click", closePub);
      });
      sheet.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closePub();
      });
    })();
  </script>
